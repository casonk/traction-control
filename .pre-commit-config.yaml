repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: repository-quality-contract
        name: tracked repository structure and artifact contract
        entry: python3 scripts/check_repository_quality.py --profile code --forbid-prefix artifacts/
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-quality-contract-tests
        name: repository quality contract tests
        entry: python3 -m unittest discover -s tests -p test_check_repository_quality.py
        language: system
        pass_filenames: false
        always_run: true
      - id: azure-runner-secret-rotation-tests
        name: Azure runner secret rotation tests
        entry: bash tests/test_rotate_azure_runner_secret.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: portfolio-theme-current
        name: portfolio theme outputs match themes/themes.toml
        entry: python3 scripts/render_portfolio_theme.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: portfolio-theme-tests
        name: portfolio theme tests
        entry: python3 -m unittest discover -s tests -p test_portfolio_theme.py
        language: system
        pass_filenames: false
        always_run: true
      - id: portfolio-private-metadata-check
        name: portfolio private-metadata index check
        entry: /bin/bash scripts/check_portfolio_privacy.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-visibility-regression-tests
        name: repository visibility and portfolio regression tests
