repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: repository-quality-contract
        name: tracked repository structure and artifact contract
        entry: python3 scripts/check_repository_quality.py --profile code --forbid-prefix artifacts/
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-quality-contract-tests
        name: repository quality contract tests
        entry: python3 -m unittest discover -s tests -p test_check_repository_quality.py
        language: system
        pass_filenames: false
        always_run: true
      - id: portfolio-private-metadata-check
        name: portfolio private-metadata index check
        entry: /bin/bash scripts/check_portfolio_privacy.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-visibility-regression-tests
        name: repository visibility and portfolio regression tests
        entry: /bin/bash tests/test_repository_visibility_ci.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: traction-control-agent-installer-tests
        name: traction-control agent installer integration tests
        entry: /bin/bash tests/test_install_traction_control_agents.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: podman-runtime-installer-tests
        name: Podman runtime installer tests
        entry: /bin/bash tests/test_install_podman_runtime.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: repo-settings-tests
        name: repository settings sync tests
        entry: python3 -m unittest discover -s tests -p test_repo_settings.py
        language: system
        pass_filenames: false
        always_run: true
      - id: main-branch-guard-tests
        name: main-branch guard hook tests
        entry: /bin/bash tests/test_main_branch_guard.sh
        language: system
        pass_filenames: false
        always_run: true
