<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery list</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Georgia, "Iowan Old Style", serif;
      margin: 0;
      background: #f4f0e6;
      color: #1c1915;
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    p { color: #5c564c; margin-top: 0; }
    ul { list-style: none; padding: 0; margin: 1.5rem 0 0; }
    li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #ddd4c4;
    }
    span { color: #5c564c; }
  </style>
</head>
<body>
  <main>
    <h1>Grocery list</h1>
    <p>A sample page. Replace this file with the real site before publishing.</p>
    <ul>
      <li>Oat milk <span>1 carton</span></li>
      <li>Eggs <span>12</span></li>
      <li>Sourdough <span>1 loaf</span></li>
      <li>Spinach <span>1 bag</span></li>
      <li>Apples <span>6</span></li>
      <li>Coffee <span>1 bag</span></li>
    </ul>
  </main>
</body>
</html>
