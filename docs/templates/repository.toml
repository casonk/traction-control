# GitHub repository settings, applied by traction-control's scripts/repo_settings.py.
# Edit here, open a pull request, and run `repo_settings.py apply` after merge.

[repository]
# One line shown on GitHub. Keep it free of private repository names and local paths.
description = "One-line summary of what this repository does."
# What the repository is, for GitHub search and browsing. Lowercase letters, digits and hyphens; at most 20, each at
# most 50 characters. Typically the language, the problem area and the main tools or protocols. Required.
topics = ["python", "automation"]

[main_branch]
# Direct commits and pushes to main are refused unless this is true.
allow_direct = false
