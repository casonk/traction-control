# Synthetic template for the ignored private-repository bundle overlay.
#
# Copy to private-repos.local.conf (ignored, owner-only) or generate a starter
# from the private visibility registry with:
#
#   bash scripts/render_private_bundle_overlay.sh --init
#
# Same pipe-delimited shape as the tracked repos.conf base bundle. Profiles are
# cumulative by convention, so an entry marked light is also present at
# moderate and heavy.
#
# Every slug here must be classified private in the visibility registry; the
# renderer refuses public or unclassified slugs. Public support repos belong in
# the tracked repos.conf instead.
#
# profiles|name|github_slug|relative_path|purpose
light,moderate,heavy|example-private-docs|example-owner/example-private-repository|util-repos/example-private-docs|Example private support repo available at every profile
heavy|example-private-secrets|example-owner/example-private-secondary|util-repos/example-private-secrets|Example private support repo added only at the heavy profile
