# Synthetic template for the ignored private overlay of portfolio-sites enrollment.
#
# Copy to ~/.config/traction-control/portfolio-sites.private.local.conf (outside every git
# work tree, mode 600). Same shape as sites.conf:
#
#   name|github_slug|relative_path|vendor_dir|fronting
#
# Every slug here must be classified private in the visibility registry; public repositories
# belong in the tracked sites.conf. Entries are verified and fail closed.
#
# example-site|example-owner/example-private-repo|util-repos/example-private-repo|src/example/portfolio|direct
