# Repositories whose web pages take part in the portfolio theme and top bar.
# Tracked, so it may name only repositories the visibility registry classifies public;
# private ones go in the ignored overlay (see private-sites.example.conf).
#
# name|github_slug|relative_path|vendor_dir|fronting
#
# vendor_dir is where `scripts/portfolio_sites.py vendor` writes the repository's last-resort
# copy (relative to the checkout). fronting is the default when the wiring-harness registry has
# no entry: wiring-harness-caddy, repo-caddy or direct.
#
# Root-staged services (nordility) and pages whose policy forbids external files are not listed:
# they ship their own pinned copies. See docs/portfolio-sites.md.
tachometer|casonk/tachometer|util-repos/tachometer|src/tachometer/portfolio|direct
intake|casonk/intake|util-repos/intake|intake/portfolio|direct
magneto|casonk/magneto|util-repos/magneto|src/magneto/portfolio|direct
session-control|casonk/session-control|util-repos/session-control|src/session_control/portfolio|direct
crew-chief|casonk/crew-chief|util-repos/crew-chief|src/crew_chief/portfolio|direct
