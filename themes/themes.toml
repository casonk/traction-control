# System themes: the one place the portfolio's colours are defined.
#
# Every web page and generated report in the portfolio styles itself with the
# CSS custom properties below, never with literal colours, so a theme switch
# restyles all of it. Edit a theme here, then run
#
#   python3 scripts/render_portfolio_theme.py
#
# to regenerate themes/portfolio-theme.css and themes/portfolio-theme.js, and
# commit all three files together. See docs/system-theme.md.
#
# Tokens (every theme defines every token):
#   icon (optional)            a short glyph the theme rotator shows
#   bg, surface, surface2      page background, cards and panels, raised/hovered rows
#   border                     rules and outlines
#   text, muted                body text, secondary text
#   accent, accent-dim         primary colour; its low-emphasis fill (badges, selected rows)
#   accent-ink                 text on a solid accent fill
#   green, red, yellow,        status and chart colours; each has a *-dim fill for
#   purple (+ -dim)            backgrounds that carry text in the matching colour

[meta]
default_dark = "midnight"   # chosen when the system prefers dark and nothing is saved
default_light = "daylight"  # chosen when the system prefers light and nothing is saved
storage_key = "portfolio-theme"

[themes.midnight]
icon = "🌙"
label = "Midnight"
description = "The original Clockwork dark palette"
scheme = "dark"
bg = "#0f1117"
surface = "#1a1d27"
surface2 = "#22263a"
border = "#2e3250"
text = "#e2e4f0"
muted = "#8890b0"
accent = "#5b7fff"
accent-dim = "#161c34"
accent-ink = "#0f1117"
green = "#3ecf6e"
green-dim = "#1a4d30"
red = "#e05252"
red-dim = "#251418"
yellow = "#e0b832"
yellow-dim = "#4a3d10"
purple = "#a06fff"
purple-dim = "#29194c"

[themes.daylight]
icon = "☀️"
label = "Daylight"
description = "A light theme for bright rooms and print"
scheme = "light"
bg = "#f4f5fa"
surface = "#ffffff"
surface2 = "#eceef6"
border = "#d3d7e6"
text = "#1c2033"
muted = "#5b6486"
accent = "#3b5bdb"
accent-dim = "#e0e8ff"
accent-ink = "#ffffff"
green = "#17743d"
green-dim = "#d3f2df"
red = "#c92a2a"
red-dim = "#ffe6e6"
yellow = "#8a5a00"
yellow-dim = "#fff3bf"
purple = "#7048e8"
purple-dim = "#eee8ff"

[themes.ember]
