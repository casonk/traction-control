# The global colour and icon library the themes page offers. Curated, read-only here: your own saved
# colours and emoji live in your owner-only local layer (see docs/system-theme.md).
# Colours: 12 hue families in five steps (100 light to 900 dark) and a slate neutral ramp, using the
# widely used Tailwind CSS v3 palette values (MIT). Emoji: grouped, with a short slug name.

